;====================================================================================
; PLATFORMIO.INI - PROYECTO CEREBRO DE HABITACIÓN INTELIGENTE
;====================================================================================
; Esta es la configuración final y completa. Incluye todas las librerías
; necesarias y las banderas de compilación para el USB nativo del ESP32-C3.
;====================================================================================

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; Banderas de compilación para forzar la activación del puerto serie
; a través del USB nativo, asegurando que el Monitor Serie funcione.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; Velocidad del Monitor Serie
monitor_speed = 115200

; Gestión de Librerías Automática
; PlatformIO buscará y descargará estas librerías por ti.
lib_deps =
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor
    miguelbalboa/MFRC522
    crankyoldgit/IRremoteESP8266
